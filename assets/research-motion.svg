<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">Xianjin Lin: dynamics, signals and reproducible models</title>
  <desc id="desc">An animated spring, abstract pulse trace and model nodes. This is decorative artwork, not measured or simulated research data. Motion stops when reduced motion is requested.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b1829"/>
      <stop offset="1" stop-color="#16394c"/>
    </linearGradient>
    <linearGradient id="signal" x2="1">
      <stop stop-color="#66ddd0" stop-opacity=".15"/>
      <stop offset=".6" stop-color="#66ddd0"/>
      <stop offset="1" stop-color="#a9efdf"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#a0c8da" stroke-opacity=".07"/>
    </pattern>
    <clipPath id="signalClip"><rect x="906" y="69" width="234" height="105" rx="8"/></clipPath>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .mass { animation: oscillate 4s ease-in-out infinite; }
      .spring { transform-box: fill-box; transform-origin: left center; animation: spring 4s ease-in-out infinite; }
      .signal { stroke-dasharray: 650; animation: trace 6s ease-in-out infinite; }
      .scan { animation: scan 6s linear infinite; }
      .node { animation: breathe 4s ease-in-out infinite; }
      .node-2 { animation-delay: 1.3s; }
      .node-3 { animation-delay: 2.6s; }
      .flow { stroke-dasharray: 3 9; animation: flow 8s linear infinite; }
      @keyframes oscillate { 0%,100% { transform: translateX(0); } 25% { transform: translateX(12px); } 75% { transform: translateX(-12px); } }
      @keyframes spring { 0%,100% { transform: scaleX(1); } 25% { transform: scaleX(1.13); } 75% { transform: scaleX(.87); } }
      @keyframes trace { 0%,8% { stroke-dashoffset: 650; } 65%,92% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: .4; } }
      @keyframes scan { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .3; } 85% { opacity: .3; } 100% { transform: translateX(218px); opacity: 0; } }
      @keyframes breathe { 0%,100% { opacity: .35; } 45% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -120; } }
      @media (prefers-reduced-motion: reduce) { .mass,.spring,.signal,.scan,.node,.flow { animation: none; } .scan { display:none; } }
    </style>
  </defs>
  <rect width="1200" height="240" rx="18" fill="url(#background)"/>
  <rect width="1200" height="240" rx="18" fill="url(#grid)"/>
  <path d="M0 237H1200" stroke="#66ddd0" stroke-opacity=".4"/>

  <rect x="46" y="45" width="34" height="4" rx="2" fill="#66ddd0"/>
  <text x="46" y="110" font-size="46" font-weight="700" letter-spacing="1" fill="#f2f8fc">XIANJIN LIN</text>
  <text x="48" y="151" font-size="18" letter-spacing="1.2" fill="#b3d3e0">DYNAMICS · SIGNALS · MODELS</text>
  <text x="48" y="187" font-size="15" fill="#87aebf">Measure carefully. Model transparently.</text>

  <g stroke="#63869d" stroke-opacity=".45" fill="none">
    <rect x="610" y="38" width="246" height="157" rx="14" fill="#081728" fill-opacity=".48"/>
    <rect x="882" y="38" width="272" height="157" rx="14" fill="#081728" fill-opacity=".48"/>
  </g>
  <text x="632" y="62" font-size="11" letter-spacing="2" fill="#93b4c6">DYNAMICS</text>
  <text x="904" y="62" font-size="11" letter-spacing="2" fill="#93b4c6">SIGNALS</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M643 93V148M638 98L643 93M638 110L643 105M638 122L643 117M638 134L643 129M638 146L643 141" stroke="#7598ae" stroke-width="2"/>
    <path class="spring" d="M644 120H654L662 104L674 136L686 104L698 136L710 104L722 136L734 104L746 136L754 120H766" stroke="#84e4d9" stroke-width="2.5"/>
    <path d="M641 158H828" stroke="#42657c" stroke-width="1.5"/>
    <g class="mass">
      <rect x="766" y="100" width="45" height="43" rx="6" fill="#234d61" stroke="#a8f2e5" stroke-width="2"/>
      <circle cx="777" cy="151" r="5" fill="#153849" stroke="#82b7c2" stroke-width="1.5"/>
      <circle cx="800" cy="151" r="5" fill="#153849" stroke="#82b7c2" stroke-width="1.5"/>
    </g>
  </g>

  <g clip-path="url(#signalClip)">
    <path d="M906 137H1140M906 103H1140M906 171H1140" stroke="#3e6076" stroke-opacity=".35"/>
    <path d="M906 144C922 144 923 143 929 134C935 113 939 87 946 91C953 94 954 119 963 125C970 130 972 119 978 127C985 141 986 144 1004 144C1016 144 1020 140 1026 122C1031 101 1035 86 1041 92C1048 101 1048 122 1058 126C1065 129 1067 119 1073 128C1080 142 1081 144 1099 144C1113 144 1115 133 1121 109C1126 89 1132 85 1138 100L1145 125" fill="none" stroke="#66ddd0" stroke-opacity=".15" stroke-width="3"/>
    <path class="signal" d="M906 144C922 144 923 143 929 134C935 113 939 87 946 91C953 94 954 119 963 125C970 130 972 119 978 127C985 141 986 144 1004 144C1016 144 1020 140 1026 122C1031 101 1035 86 1041 92C1048 101 1048 122 1058 126C1065 129 1067 119 1073 128C1080 142 1081 144 1099 144C1113 144 1115 133 1121 109C1126 89 1132 85 1138 100L1145 125" fill="none" stroke="url(#signal)" stroke-width="3"/>
    <rect class="scan" x="906" y="77" width="16" height="93" rx="8" fill="#a6efe0" opacity=".2"/>
  </g>

  <path class="flow" d="M733 195V213H1018V195" fill="none" stroke="#8fb7d8" stroke-width="1.5"/>
  <g fill="#b6abf4" stroke="#17283e" stroke-width="3">
    <circle class="node" cx="841" cy="213" r="5"/>
    <circle class="node node-2" cx="876" cy="213" r="5"/>
    <circle class="node node-3" cx="911" cy="213" r="5"/>
  </g>
</svg>
